<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0d14"/>
      <stop offset="100%" stop-color="#050608"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2a2a"/>
      <stop offset="100%" stop-color="#ff4a4a"/>
    </linearGradient>
    <filter id="redGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo oscuro con bordes curvados de alta tecnología -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#222533" stroke-width="4"/>
  <rect x="6" y="6" width="500" height="500" rx="110" fill="none" stroke="#ff2a2a" stroke-width="4" stroke-opacity="0.35" stroke-dasharray="140 30 80 40"/>

  <!-- Letra P mayúscula geométrica Pro-Stasis con agujero interior (evenodd) -->
  <path fill-rule="evenodd" clip-rule="evenodd" d="
    M 140 115 
    L 310 115 
    C 380 115, 415 155, 415 225 
    C 415 295, 380 335, 310 335 
    L 225 335 
    L 225 397 
    L 140 397 
    Z
    M 225 185 
    L 300 185 
    C 335 185, 345 200, 345 225 
    C 345 250, 335 265, 300 265 
    L 225 265 
    Z
  " fill="#ffffff"/>

  <!-- Guión rojo cibernético '-' estilo logo Pro-Stasis -->
  <g filter="url(#redGlow)">
    <rect x="345" y="315" width="65" height="20" rx="5" fill="url(#redGrad)"/>
    <!-- Detalle de línea técnica inferior de la camiseta -->
    <rect x="140" y="420" width="130" height="10" rx="5" fill="#ff2a2a"/>
    <circle cx="295" cy="425" r="5" fill="#ff2a2a"/>
  </g>
</svg>
